const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(S),iterations:IT,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(V)},k,u8(D));
  const st=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(st).text();
}
function entrar(h){document.open();document.write(h);document.close();}
const f=document.getElementById('f'),p=document.getElementById('p'),e=document.getElementById('e'),b=document.getElementById('b');
f.onsubmit=async ev=>{ev.preventDefault();e.textContent='';b.disabled=true;b.textContent='Abrindo…';
  try{const h=await abrir(p.value);
    try{if(document.getElementById('m').checked)localStorage.setItem('janela.pw',p.value);}catch(_){}
    entrar(h);
  }catch(_){e.textContent='Senha incorreta.';b.disabled=false;b.textContent='Entrar';p.select();}};
(async()=>{let pw=null;try{pw=localStorage.getItem('janela.pw');}catch(_){}
  if(pw){try{entrar(await abrir(pw));return;}catch(_){try{localStorage.removeItem('janela.pw');}catch(__){}}}
  f.style.display='block';p.focus();})();
